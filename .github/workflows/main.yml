name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          java-package: jdk

      - name: Add WiX Toolset to PATH
        shell: pwsh
        run: |
          $wix = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wix) {
            Write-Host "WiX Toolset not found, installing via choco..."
            choco install wixtoolset -y --no-progress
            $wix = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($wix) {
            "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "WiX found at: $($wix.FullName)\bin"
          } else {
            Write-Error "WiX Toolset not found. jpackage --type exe requires WiX 3.x."
            exit 1
          }

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="1.0.0"
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Compile
        shell: bash
        run: |
          mkdir -p build/classes
          javac -encoding UTF-8 -cp "lib/*" -d build/classes NewNetOneEventlog.java

      - name: Build jar (with POI deps alongside for jpackage's classpath)
        shell: bash
        run: |
          mkdir -p build/libs
          jar --create --file build/libs/NewNetOneEventlog.jar --main-class NewNetOneEventlog -C build/classes .
          cp lib/*.jar build/libs/

      - name: Exclude workspace from Windows Defender
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionProcess "jpackage.exe"
          Add-MpPreference -ExclusionProcess "jlink.exe"

      - name: Build Windows EXE installer
        shell: bash
        run: |
          mkdir -p dist build/jpackage-temp
          jpackage \
            --type exe \
            --name NewNetOneEventlog \
            --app-version "${{ steps.version.outputs.value }}" \
            --vendor "surya" \
            --description "NewNetOne Eventlog Exporter" \
            --input build/libs \
            --main-jar NewNetOneEventlog.jar \
            --main-class NewNetOneEventlog \
            --dest dist \
            --temp build/jpackage-temp \
            --win-menu \
            --win-shortcut \
            --win-dir-chooser \
            --java-options "-Dfile.encoding=UTF-8"

      - name: Verify bundled JVM launcher survived packaging
        shell: bash
        run: |
          found=$(find build/jpackage-temp -type f -iname "java.exe" -path "*/runtime/bin/*" 2>/dev/null | head -n1)
          if [ -z "$found" ]; then
            echo "ERROR: no runtime/bin/java.exe found anywhere under build/jpackage-temp."
            echo "This usually means Windows Defender quarantined jlink/jpackage output during the build."
            echo "Directory layout under build/jpackage-temp:"
            find build/jpackage-temp -maxdepth 5 -type d || true
            exit 1
          fi
          echo "OK: found $found"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewNetOneEventlog-windows-exe-${{ steps.version.outputs.value }}
          path: dist/*.exe
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: NewNetOneEventlog v${{ steps.version.outputs.value }}
          files: dist/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
